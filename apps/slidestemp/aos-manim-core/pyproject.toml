[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aos-manim-core"
version = "0.1.0"
description = "Core theming engine, manifest protocol, invariant validators, and plugin registry for AOS Manim"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "manim>=0.18.0",
    "pydantic>=2.0.0",
    "numpy>=1.20.0",
    "sympy>=1.12",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
