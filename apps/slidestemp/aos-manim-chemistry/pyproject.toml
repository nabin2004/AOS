[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aos-manim-chemistry"
version = "0.1.0"
description = "STEM chemistry, molecular geometry, and reaction mechanism visualization plugin for AOS Manim"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "manim>=0.18.0",
    "numpy>=1.20.0",
    "aos-manim-core>=0.1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
