[project]
name = "agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ir",
    "audio-service",
    "mcpservers",
    "dotenv>=0.9.9",
    "pydantic>=2.13.4",
    "pydantic-ai>=2.5.0",
    "pydantic-ai-slim[dbos,google,openrouter,web]>=2.5.0",
    "logfire[system-metrics]>=4.37.0",
    "dspy>=3.0.0",
    "pydantic-graph>=2.5.0",
    "httpx>=0.28.0",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "sympy>=1.13.0",
    "pandas>=2.2.0",
    "python-chess>=1.999",
    "qrcode[pil]>=8.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "terminaltexteffects>=0.11.0",
    "pydantic-ai-harness[code-mode,codemode,logfire]>=0.6.0",
    "uvicorn>=0.50.0",
    "manim-voiceover>=0.3.7",
    "manim-deeplearning",
    "manim-chess",
    "manim-ai",
    "manim-viz",
    "manim-math",
    "manim-physics",
    "manim-dsa",
    "ipython>=9.15.0",
    "torch>=2.12.1",
    "distlib>=0.4.3",
    "chess>=1.11.2",
    "aos-manim-core",
    "aos-manim-slides",
    "educlaw",
    "boto3>=1.42.0",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tools*", "prompt_optimization*"]
exclude = ["workspace*"]

[tool.setuptools]
py-modules = [
    "agent_graph",
    "assemble_runner",
    "beat_planner_agent",
    "classifier_agent",
    "cli",
    "code_agent",
    "coder_agent",
    "coder_run",
    "error_feedback",
    "codemode_retry",
    "durable_agents",
    "export_coder_sft",
    "export_local_sft",
    "graph",
    "inspector_agent",
    "lecture_planner",
    "llm_config",
    "manim_code_writer_agent",
    "narration_planner_agent",
    "observability",
    "openai_compatible",
    "repair_agent",
    "scene_planner_agent",
    "storyboard_planner",
    "teaching_script",
    "trajectory_recorder",
    "validation_agent",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
ir = { workspace = true }
audio-service = { workspace = true }
mcpservers = { workspace = true }
manim-deeplearning = { path = "tools/templates/deeplearning", editable = true }
manim-chess = { path = "tools/templates/chess", editable = true }
manim-ai = { path = "tools/templates/ai", editable = true }
manim-viz = { path = "tools/templates/viz", editable = true }
manim-math = { path = "tools/templates/math", editable = true }
manim-physics = { path = "tools/templates/physics", editable = true }
manim-dsa = { path = "tools/templates/dsa", editable = true }
torch = { index = "pytorch-cpu" }
aos-manim-core = { workspace = true }
aos-manim-slides = { workspace = true }
educlaw = { workspace = true }
