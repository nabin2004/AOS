[project]
name = "manim-dsa"
version = "0.1.0"
description = "Algorithms & data-structures visualizers for Manim (AOS)"
requires-python = ">=3.12"
dependencies = ["manim>=0.18", "manim-viz", "numpy>=2.0"]

[project.entry-points."manim.plugins"]
manim_dsa = "manim_dsa"

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["manim_dsa*"]

[tool.uv.sources]
manim-viz = { path = "../viz", editable = true }
