[project]
name = "mcpservers"
version = "0.1.0"
description = "MCP server for Manim API vector search"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4.4",
    "numpy>=2.0.0",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=3.0.0",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["chunker", "config", "embedder", "main", "vector_index"]
