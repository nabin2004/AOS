[CLI]
# =========================================================================
# AOS (Agentic Orchestration System) - Manim CE Configuration
# =========================================================================
# This configuration guarantees clean, deterministic, and high-performance
# rendering for the autonomous pedagogical video generation pipeline.

# --- Output & Workspace Management ---
# Isolate all run artifacts to prevent repository pollution and git noise.
# This ensures that LLM contexts are not bloated with intermediate files.
media_dir = workspace/media
log_dir = workspace/logs
video_dir = {media_dir}/videos/{module_name}/{quality}
images_dir = {media_dir}/images/{module_name}
text_dir = {media_dir}/Tex
partial_movie_dir = {video_dir}/partial_movie_files/{scene_name}

# --- Canvas & Quality Defaults ---
# The pipeline's deterministic spatial engine (Layout Critic) assumes 16:9.
# The default canvas background matches our standard dark theme.
background_color = #0E1117
pixel_height = 1080
pixel_width = 1920
frame_rate = 60
quality = high_quality

# --- Caching & Performance ---
# Caching is critical for the Repair Agent's iterative refinement loops.
# We retain caches between runs but disable the noisy cache warnings.
disable_caching = False
disable_caching_warning = True
flush_cache = False

# --- Headless Execution & Logging ---
# Ensure the rendering engine acts purely as a headless compiler.
# We suppress preview windows and downgrade verbosity to keep stdout clean
# so that agent stack traces are easily parsable.
preview = False
verbosity = INFO
progress_bar = display
log_to_file = True
notify_outdated_version = False
