[project]
name = "tui"
version = "0.1.0"
description = "Interactive Typer CLI for AOS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rich>=15.0.0",
    "store",
    "terminaltexteffects>=0.15.0",
    "typer>=0.26.8",
]

[project.scripts]
aos-tui = "tui:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tui"
module-root = ""
source-include = ["ascii-art.txt"]

[tool.uv.sources]
store = { workspace = true }
