[project]
name = "aos-lkg"
version = "0.1.0"
description = "AOS Mathematical & Computational Knowledge Graph (LKG) for Manim Code Generation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "networkx>=3.2.1",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "sympy>=1.12.0",
    "shapely>=2.0.0",
    "mpmath>=1.3.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "manim>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
aos-lkg = "aos_lkg.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aos_lkg"]
