[project]
name = "educlaw"
version = "0.1.0"
description = "EduClaw — Manim coding-agent harness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "clai>=2.22.0",
    "dagestan>=0.1.0",
    "ipython>=9.15.0",
    "pydantic-ai>=2.5.0",
    "pydantic-ai-skills>=0.11.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "terminaltexteffects>=0.15.0",
    "typer>=0.26.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]
durable = [
    "kitaru-pydantic-ai",
]

[project.scripts]
educlaw = "educlaw.cli:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "educlaw"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
