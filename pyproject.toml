[project]
name = "aos"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "store",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "terminaltexteffects>=0.11.0",
    "pydantic-ai-slim[google]>=2.5.0",
    "pydantic-ai-harness[code-mode]>=0.6.0",
    "pydantic-ai[dbos]>=2.5.0",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
store = { workspace = true }
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[tool.ruff.lint.per-file-ignores]
"apps/agents/tools/templates/**" = ["F403", "F405"]
"apps/agents/tools/assets/**" = ["F403", "F405", "F841"]
"apps/agents/agent_graph.py" = ["E402"]
"apps/agents/export_local_sft.py" = ["E402"]
"apps/agents/export_traces/tests/**" = ["E402"]
"apps/agents/tools/templates/001_intro.py" = ["E402"]
"apps/agents/tools/templates/deeplearning/**" = ["F841"]

[tool.setuptools.packages.find]
include = ["apps*", "packages*"]
exclude = ["notes*"]

[tool.uv.workspace]
members = [
    "packages/ir",
    "packages/schemas",
    "packages/store",
    "apps/agents",
    "apps/server",
    "apps/audio_service",
    "apps/tui",
    "prepdata",
    "apps/manimator",
    "apps/manimator/agents",
    "apps/manimator/manim_agents",
    "apps/mcpservers",
    "apps/sft",
    "apps/grpo",
    "apps/educlaw",
    "apps/slidestemp/aos-manim-core",
    "apps/slidestemp/aos-manim-slides",
]
