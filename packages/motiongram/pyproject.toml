[project]
name = "motiongram"
version = "0.5.0"
description = "Declarative kinetic teaching animation engine and compiler for ManimCE"
readme = "README.md"
authors = [
    { name = "Nabin Oli", email = "olinabin2004@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"
