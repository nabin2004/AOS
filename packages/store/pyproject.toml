[project]
name = "store"
version = "0.1.0"
description = "Local JSON storage, mock lecture/course generation, and dummy HTML player for AOS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ir",
    "pydantic>=2.0.0",
]

[tool.uv.sources]
ir = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"
